---
name: release
'on':
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - name: Stamp the released version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s/\"version\": \"0\.0\.0\"/\"version\": \"${VERSION}\"/" \
            package.json
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - name: Publish to npm via OIDC
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
      - name: Set the GitHub release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/changelog-notes.js "${VERSION}" > notes.md
          gh release edit "${VERSION}" --notes-file notes.md \
            || gh release create "${VERSION}" --title "${VERSION}" \
              --notes-file notes.md
      - name: Trigger the JetBrains plugin cascade
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          printf '{"event_type":"xslint-lsp-released","client_payload":{"version":"%s"}}' \
            "${VERSION}" | gh api -X POST repos/xslint/xslint-jetbrains/dispatches --input -
  extension:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      OVSX: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for the released server to resolve on npm
        working-directory: client
        timeout-minutes: 70
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "waiting for xslint-lsp@${VERSION} to propagate to npm"
          streak=0
          for attempt in $(seq 1 80); do
            if reason="$(timeout 20 npm pack --dry-run --prefer-online "xslint-lsp@${VERSION}" 2>&1 > /dev/null)"; then
              streak=$((streak + 1))
            else
              code=$?
              streak=0
              echo "attempt ${attempt} missed with exit ${code}: $(grep -m 1 'npm error' <<< "${reason}" || echo 'nothing on stderr')"
            fi
            test "${streak}" -ge 3 && break
            if [ "${attempt}" -lt 80 ]; then
              sleep 30
            fi
          done
          if [ "${streak}" -lt 3 ]; then
            echo "::error::xslint-lsp@${VERSION} did not resolve three times in a row in 80 attempts thirty seconds apart"
            exit 1
          fi
      - name: Build the extension bundling the released server
        working-directory: client
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          npm install --save-exact "xslint-lsp@${VERSION}"
          npm version "${VERSION}" --no-git-tag-version
          npx vsce package --out "xslint-vscode-${VERSION}.vsix"
      - name: Attach the extension to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload "${VERSION}" "client/xslint-vscode-${VERSION}.vsix" --clobber
      - name: Publish to Open VSX
        if: env.OVSX != ''
        working-directory: client
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          npx --yes ovsx create-namespace maxonfjvipon -p "${OVSX}" || true
          for attempt in $(seq 1 5); do
            echo "publishing ${VERSION} to Open VSX, attempt ${attempt}"
            npx --yes ovsx publish "xslint-vscode-${VERSION}.vsix" -p "${OVSX}" && exit 0
            sleep 30
          done
          echo "Open VSX refused ${VERSION} on every attempt"
          exit 1
